name: astrbot_plugin_coeiroink_tts
display_name: Tsukuyomi-chan COEIROINK 日语语音
desc: 使用 COEIROINK 引擎，把 AstrBot 的回复文本（必要时先由大模型翻译成日语）合成为语音，并以语音消息发出。支持总是翻译朗读、按需命令触发、概率触发、仅日语朗读四种模式，并支持 平静(れいせい)/温柔(おしとやか)/充满活力(げんき) 三种情绪风格，可在配置中设定默认风格、并按单次请求临时切换。引擎目录、可执行文件、日志、ffmpeg 等环境相关项均可配置（配置项→环境变量→自动推导），不绑定具体机器。音源：月读酱（Tsukuyomi-chan，夢前黎制作，免费音源 https://tyc.rei-yumesaki.net/）；软件：COEIROINK（シロワニさん制作，免费 TTS https://coeiroink.com/）。
version: v1.2.1
author: 索拉
repo: ""
